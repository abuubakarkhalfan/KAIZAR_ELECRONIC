{% if order.status == "pending" and order.payment_method == "HaloPesa" %}
  <div class="notice">
    Tuma TZS {{ order.total }} kwa HaloPesa namba 0612660381.
    Baada ya kupata SMS ya HaloPesa, weka namba ya muamala hapa.
    Usiweke PIN yako kwenye tovuti.
  </div>

  <form method="post"
        action="{% url 'submit_payment_reference' order.reference %}">
    {% csrf_token %}
    <label for="payment_reference">Namba ya muamala ya HaloPesa</label>
    <input id="payment_reference" name="payment_reference"
           maxlength="80" required>
    <button type="submit">Tuma namba ya muamala</button>
  </form>
{% endif %}
